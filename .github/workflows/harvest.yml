name: Harvest clinics (연수구 치과 수확)

# Actions 탭 → 이 워크플로 → "Run workflow"로 실행 (KAKAO_REST_KEY secret 필요)
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clinics-write
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/dental-clinic-map-incheon-i4t5sj
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Harvest 연수구 치과 (Kakao)
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: node harvest.js
      - name: Rebuild pages & sitemap, test
        run: |
          node build.js
          node test.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clinics.js region/ sitemap.xml
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "연수구 치과 수확: 카카오 장소검색 (Actions)"
            ok=0
            for i in 1 2 3 4 5; do
              git fetch origin claude/dental-clinic-map-incheon-i4t5sj || true
              if git rebase origin/claude/dental-clinic-map-incheon-i4t5sj && git push origin HEAD:claude/dental-clinic-map-incheon-i4t5sj; then ok=1; break; fi
              git rebase --abort || true
              sleep $((i * 5))
            done
            [ "$ok" = 1 ] || { echo "push 실패(동시 변경)"; exit 1; }
          fi
