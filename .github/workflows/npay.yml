name: NPAY portal (심평원 비급여 포털 수집)

# Actions 탭 → Run workflow. 연수구 치과임플란트(의원급 포함) 비급여가 수집.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clinics-write
  cancel-in-progress: false

jobs:
  npay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/dental-clinic-map-incheon-i4t5sj
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Collect npay (비급여 포털)
        run: node npay.js
      - name: Geocode new clinics (좌표 없는 신규삽입분만)
        continue-on-error: true
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          ONLY_MISSING: "1"
        run: node geocode.js
      - name: Rebuild pages & sitemap, test
        run: |
          node build.js
          node test.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clinics.js region/ sitemap.xml
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "심평원 비급여 포털(의원급 포함) 임플란트가 수집 (Actions)"
            ok=0
            for i in 1 2 3 4 5; do
              git fetch origin claude/dental-clinic-map-incheon-i4t5sj || true
              if git rebase origin/claude/dental-clinic-map-incheon-i4t5sj && git push origin HEAD:claude/dental-clinic-map-incheon-i4t5sj; then ok=1; break; fi
              git rebase --abort || true
              sleep $((i * 5))
            done
            [ "$ok" = 1 ] || { echo "push 실패"; exit 1; }
          fi
