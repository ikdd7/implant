name: Deploy to GitHub Pages

# 브랜치 푸시 시 정적 사이트 배포. (Settings → Pages → Source: GitHub Actions 로 설정)
on:
  push:
    branches:
      - claude/dental-clinic-map-incheon-i4t5sj
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Harvest clinics (연수구 치과 수확)"
      - "HIRA implant prices (심평원 임플란트 비급여가)"
      - "NPAY portal (심평원 비급여 포털 수집)"
      - "Scrape clinic sites (홈페이지 게시가)"
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
