name: Scrape clinic sites (홈페이지 수가표)

# clinics.js의 homepage가 있는 치과의 임플란트 수가표(HTML/PDF/이미지 OCR)를 읽어 가격 덮어쓰기.
# 먼저 "Find homepages"로 homepage를 채운 뒤 실행.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "특정 치과명만(테스트용, 선택)"
        default: ""
      limit:
        description: "처리 개수 제한(선택)"
        default: ""
      debug:
        description: "OCR 디버그 로그(1이면 켜기)"
        default: ""

permissions:
  contents: write

concurrency:
  group: clinics-write
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/dental-clinic-map-incheon-i4t5sj
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install OCR tools (tesseract-kor, poppler)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-kor poppler-utils
      - name: Install Playwright + Chromium
        run: |
          npm i playwright@1.56.1 --no-save --no-package-lock
          npx playwright install --with-deps chromium
      - name: Scrape homepage 수가표
        env:
          SCRAPE_ONLY: ${{ inputs.only }}
          SCRAPE_LIMIT: ${{ inputs.limit }}
          SCRAPE_DEBUG: ${{ inputs.debug }}
        run: node scrape-clinic.js
      - name: Rebuild pages & sitemap, test
        run: |
          node build.js
          node test.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clinics.js region/ sitemap.xml
          git checkout -- package.json package-lock.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "홈페이지 수가표 임플란트가 수집 (Actions)"
            ok=0
            for i in 1 2 3 4 5; do
              git fetch origin claude/dental-clinic-map-incheon-i4t5sj || true
              if git rebase origin/claude/dental-clinic-map-incheon-i4t5sj && git push origin HEAD:claude/dental-clinic-map-incheon-i4t5sj; then ok=1; break; fi
              git rebase --abort || true
              sleep $((i * 5))
            done
            [ "$ok" = 1 ] || { echo "push 실패"; exit 1; }
          fi
