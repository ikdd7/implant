name: Find homepages (치과 홈페이지 URL 수집)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clinics-write
  cancel-in-progress: false

jobs:
  homepages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/dental-clinic-map-incheon-i4t5sj
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Find homepages (네이버 지역검색)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node homepages.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clinics.js
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "치과 홈페이지 URL 수집 (Actions)"
            ok=0
            for i in 1 2 3 4 5; do
              git fetch origin claude/dental-clinic-map-incheon-i4t5sj || true
              if git rebase origin/claude/dental-clinic-map-incheon-i4t5sj && git push origin HEAD:claude/dental-clinic-map-incheon-i4t5sj; then ok=1; break; fi
              git rebase --abort || true
              sleep $((i * 5))
            done
            [ "$ok" = 1 ] || { echo "push 실패"; exit 1; }
          fi
